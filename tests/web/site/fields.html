<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fields far away</title>
    <style>
      /* Fields that are not in the picture when the page opens: below the fold, where a
         sticky header will lie on them, and at the bottom of a panel that scrolls. */
      body {
        margin: 0;
        height: 1600px;
        font: 14px sans-serif;
        background: #ffffff;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        height: 50px;
        background: #222233;
        color: #ffffff;
      }
      label {
        position: absolute;
        left: 40px;
        display: block;
        width: 240px;
      }
      input,
      select {
        display: block;
        width: 240px;
        height: 30px;
        box-sizing: border-box;
        font: inherit;
      }
      #name-label {
        top: 900px;
      }
      #email-label {
        top: 1000px;
      }
      #phone-label {
        top: 1100px;
      }
      #plan-label {
        top: 1200px;
      }
      #panel {
        position: absolute;
        left: 340px;
        top: 80px;
        width: 280px;
        height: 150px;
        overflow: auto;
        background: #eeeeee;
      }
      #panel-in {
        position: relative;
        height: 600px;
      }
      #city-label {
        top: 480px;
        left: 20px;
      }
      #size-label {
        top: 300px;
        left: 20px;
      }
    </style>
  </head>
  <body>
    <header>A header that stays</header>
    <label id="name-label">Name <input id="name" name="name" placeholder="Ada Lovelace" /></label>
    <label id="email-label">Email <input id="email" name="email" type="email" /></label>
    <label id="phone-label">Phone <input id="phone" name="phone" /></label>
    <label id="plan-label"
      >Plan
      <select id="plan">
        <option value="free">Free</option>
        <option value="team">Team</option>
      </select></label
    >
    <div id="panel">
      <div id="panel-in">
        <label id="size-label"
          >Size
          <select id="size">
            <option value="s">Small</option>
            <option value="l">Large</option>
          </select></label
        >
        <label id="city-label">City <input id="city" name="city" /></label>
      </div>
    </div>
    <script>
      // What every field holds, for a step that checks it: `values()` → "name=Ada|email=…".
      window.values = () =>
        [...document.querySelectorAll('input')]
          .map((input) => `${input.id}=${input.value}`)
          .join('|');
      // What every list says, and whether it was whole in the picture — below the header, or
      // in the panel's window — at the moment its choice was made: "plan=team in view|…".
      document.addEventListener('change', ({ target }) => {
        if (target.tagName !== 'SELECT') return;
        const box = target.getBoundingClientRect();
        const frame = target.closest('#panel')?.getBoundingClientRect() || {
          top: 50,
          bottom: innerHeight,
        };
        const whole = box.top >= frame.top && box.bottom <= frame.bottom;
        target.dataset.seen = whole ? 'in view' : 'out of view';
      });
      window.picked = () =>
        [...document.querySelectorAll('select')]
          .map((list) => `${list.id}=${list.value} ${list.dataset.seen || 'untouched'}`)
          .join('|');
    </script>
  </body>
</html>
