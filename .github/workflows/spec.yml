name: Spec Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Spec compliance and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Render, preview and analysis tests run real FFmpeg; titles need fonts.
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Spec compliance
        run: node scripts/spec.js all

      - name: Tests (Node + browser)
        run: npm test
