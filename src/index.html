<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NearEdit</title>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/shared.css" />
    <link rel="stylesheet" href="/styles/buttons.css" />
    <link rel="stylesheet" href="/styles/forms.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/components-timeline.css" />
    <link rel="stylesheet" href="/styles/components-panels.css" />
    <link rel="stylesheet" href="/styles/components-shell.css" />
    <link rel="stylesheet" href="/styles/editor.css" />
    <link rel="stylesheet" href="/styles/elements.css" />
    <link rel="stylesheet" href="/styles/overlays.css" />
    <link rel="stylesheet" href="/styles/fields.css" />

    <script type="importmap">
      {
        "imports": {
          "hybrids": "/vendor/hybrids/index.js",
          "#store/": "/store/",
          "#utils/": "/utils/",
          "#atoms/": "/components/atoms/",
          "#molecules/": "/components/molecules/",
          "#organisms/": "/components/organisms/",
          "#templates/": "/components/templates/",
          "#pages/": "/pages/"
        }
      }
    </script>
  </head>
  <body>
    <script>
      // Apply theme before render to prevent flash
      try {
        const s = JSON.parse(localStorage.getItem('nearedit_appState'));
        document.documentElement.setAttribute(
          'data-theme',
          s?.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
        );
      } catch {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <app-router></app-router>
    <script type="module" src="/router/index.js"></script>
  </body>
</html>
