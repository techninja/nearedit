<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="NearEdit — a browser-based video editor with an assistant editor, next to your media."
    />
    <title>NearEdit</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/shared.css" />
    <link rel="stylesheet" href="/styles/buttons.css" />
    <link rel="stylesheet" href="/styles/forms.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/components-timeline.css" />
    <link rel="stylesheet" href="/styles/components-panels.css" />
    <link rel="stylesheet" href="/styles/components-shell.css" />
    <link rel="stylesheet" href="/styles/components-create.css" />
    <link rel="stylesheet" href="/styles/editor.css" />
    <link rel="stylesheet" href="/styles/elements.css" />
    <link rel="stylesheet" href="/styles/overlays.css" />
    <link rel="stylesheet" href="/styles/fields.css" />

    <script>
      // Apply the theme before first paint so the page never flashes the
      // wrong one. Same rule as utils/ui/theme.js: an explicit choice wins,
      // otherwise follow the system.
      (function () {
        var theme = '';
        try {
          theme = (JSON.parse(localStorage.getItem('nearedit_appState')) || {}).theme;
        } catch (e) {
          theme = '';
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "hybrids": "/vendor/hybrids/index.js",
          "#store/": "/store/",
          "#utils/": "/utils/",
          "#atoms/": "/components/atoms/",
          "#molecules/": "/components/molecules/",
          "#organisms/": "/components/organisms/",
          "#templates/": "/components/templates/",
          "#pages/": "/pages/"
        }
      }
    </script>
  </head>
  <body>
    <app-router></app-router>
    <noscript>NearEdit needs JavaScript.</noscript>
    <script type="module" src="/router/index.js"></script>
  </body>
</html>
